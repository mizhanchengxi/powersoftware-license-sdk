[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ps-license-sdk"
version = "0.1.0"
description = "PowerSoftware license SDK for Python (activate/verify/deactivate/software generate/upgrade/trial claim)"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools]
packages = ["ps_license_sdk"]
